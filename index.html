<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hcode Space - Estrelas Cadentes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, #021123 0%, #000 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;      
            justify-content: center;
            overflow: hidden; /* Importante para as estrelas não criarem barras de rolagem */
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .gif-container img {
            max-width: 220px;
            filter: drop-shadow(0 0 20px #00ffff);
            animation: float 4s ease-in-out infinite;
        }

        .frase {
            font-size: 3.5rem;
            font-weight: 900;
            margin-top: 20px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        /* Responsividade para telas menores */
        @media (max-width: 600px) {
            .frase { font-size: 2.5rem; }
            .gif-container img { max-width: 160px; }
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<main>
    <div class="gif-container">
        <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdG1pYTd5ZWJzaHdtenRtczZqcTNjc2ozazh5Z3RhMWFqc3RxbTh1dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9dHM/qUABlXKRRvfQobzIXp/giphy.gif" alt="Astronauta Neon">
    </div>
    <h1 class="frase">Hello, World!</h1>
</main>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        
        // Estrelas fixas de fundo
        const starCount = Math.floor((canvas.width * canvas.height) / 3000);
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    class ShootingStar {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * canvas.width;
            this.y = 0;
            this.length = Math.random() * 100 + 20;
            this.speed = Math.random() * 12 + 6;
            this.opacity = 1;
            this.active = true;
        }

        update() {
            this.x += this.speed;
            this.y += this.speed; 
            this.opacity -= 0.012; // Desaparece aos poucos

            if (this.opacity <= 0 || this.x > canvas.width || this.y > canvas.height) {
                this.active = false;
            }
        }

        draw() {
            ctx.save();
            ctx.strokeStyle = `rgba(0, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 8;
            ctx.shadowColor = "#00ffff";
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.length, this.y - this.length);
            ctx.stroke();
            ctx.restore();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Estrelas de fundo
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // Chance de criar estrela cadente (2% por frame)
        if (Math.random() < 0.02) {
            shootingStars.push(new ShootingStar());
        }

        // Atualiza e desenha as estrelas cadentes
        shootingStars = shootingStars.filter(s => s.active);
        shootingStars.forEach(s => {
            s.update();
            s.draw();
        });

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    init();
    animate();
</script>

</body>
</html>
