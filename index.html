<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELLO World - Atmosfera Completa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #000814, #01476f, #380155);
            display: flex;
            align-items: center;      
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
            color: white;
            position: relative;
        }

        #starCanvas { 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0; 
        }

        .floating-gif {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            filter: blur(2px);
            animation: moveNatural linear infinite;
        }

        @keyframes moveNatural {
            0% { transform: translateX(-40vw); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateX(110vw); opacity: 0; }
        }

        main {
            position: relative;
            z-index: 10; 
            text-align: center;
        }

        /* --- AQUI ESTÁ A MUDANÇA NA FRASE --- */
        .frase {
            font-size: 3.5rem;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: -1px;
            
            /* 1. Definimos o degradê que você criou */
            background: linear-gradient(to bottom, #aa069f, #5e17b5, #1204ad);
            
            /* 2. Fazemos o fundo "prender" apenas no texto */
            -webkit-background-clip: text;
            background-clip: text;
            
            /* 3. Deixamos a cor original transparente para o degradê aparecer */
            -webkit-text-fill-color: transparent;
            color: transparent;

            /* Brilho neon ajustado para a nova cor */
            filter: drop-shadow(0 0 15px rgba(94, 23, 181, 0.6));
        }

        .gif-principal img {
            max-width: 180px;
            filter: drop-shadow(0 0 20px #00ffff);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<main>
    <div class="gif-principal">
        <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdG1pYTd5ZWJzaHdtenRtczZqcTNjc2ozazh5Z3RhMWFqc3RxbTh1dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9dHM/qUABlXKRRvfQobzIXp/giphy.gif" alt="Astronauta">
    </div>
    <h1 class="frase">Hello, World!</h1>
</main>

<script>
    // Todo o seu JavaScript das estrelas e nuvens permanece igual aqui...
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function init() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        const starCount = Math.floor((canvas.width * canvas.height) / 3000);
        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.5,
                opacity: Math.random()
            });
        }
    }

    class ShootingStar {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = 0;
            this.length = Math.random() * 80 + 20;
            this.speed = Math.random() * 10 + 5;
            this.opacity = 1;
            this.active = true;
        }
        update() {
            this.x += this.speed;
            this.y += this.speed;
            this.opacity -= 0.015;
            if (this.opacity <= 0) this.active = false;
        }
        draw() {
            ctx.strokeStyle = `rgba(0, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - this.length, this.y - this.length);
            ctx.stroke();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
            ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });
        if (Math.random() < 0.015) shootingStars.push(new ShootingStar());
        shootingStars = shootingStars.filter(s => s.active);
        shootingStars.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animate);
    }

    const gifUrl = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnBsdGpnemR4bXlnbTl3dG55YzhkOXZjZ2x5bGJiOGU1djY3Z2diZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/xT9IgsFcDKywF7orkI/giphy.gif";
    const totalGifs = 7; 

    for (let i = 0; i < totalGifs; i++) {
        const img = document.createElement('img');
        img.src = gifUrl;
        img.className = 'floating-gif';
        img.style.top = (Math.random() * 100) - 10 + "vh";
        const size = Math.random() * 300 + 250; 
        img.style.width = size + "px";
        img.style.animationDuration = (Math.random() * 20 + 25) + "s";
        img.style.animationDelay = (Math.random() * -50) + "s";
        document.body.appendChild(img);
    }

    window.addEventListener('resize', init);
    init();
    animate();
</script>

</body>
</html>
