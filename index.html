<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrelas Neon Corrigidas</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            /* O segredo do neon é o fundo escuro */
            background-color: #0a0a0b; 
        }
        canvas { display: block; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');

    function setup() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }

    function draw() {
        // Limpa com a cor do fundo
        ctx.fillStyle = "#0a0a0b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const starCount = Math.floor((canvas.width * canvas.height) / 3000);

        for (let i = 0; i < starCount; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const size = Math.random() * 2 + 0.5;

            // --- A MÁGICA DO NEON ---
            ctx.shadowBlur = 8;           // Tamanho do brilho
            ctx.shadowColor = "#00ffff";  // Cor do neon (Ciano)
            ctx.fillStyle = "#ffffff";    // Cor do centro (Branco p/ brilhar)
            
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            // Reseta a sombra para não pesar no próximo cálculo (importante!)
            ctx.shadowBlur = 0;
        }
    }

    window.addEventListener('resize', setup);
    setup();
</script>

</body>
</html>
