<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrelas Neon com Gradiente</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            /* Aplicando o seu gradiente aqui */
            background: linear-gradient(to bottom, #002c46, #01476f, #380155);
            height: 100vh;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');

    function setup() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }

    function draw() {
        // MUDANÇA AQUI: Em vez de preencher com cor sólida (#0a0a0b), 
        // limpamos o canvas para o gradiente do fundo (CSS) aparecer.
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const starCount = Math.floor((canvas.width * canvas.height) / 3000);

        for (let i = 0; i < starCount; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const size = Math.random() * 2 + 0.5;

            ctx.shadowBlur = 8;
            ctx.shadowColor = "#00ffff"; 
            ctx.fillStyle = "#ffffff"; 
            
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }
    }

    window.addEventListener('resize', setup);
    setup();
</script>

</body>
</html>
