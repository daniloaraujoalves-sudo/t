<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELLO World - Neon Drift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #000814, #01476f, #380155);
            display: flex;
            align-items: center;      
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
            color: white;
            position: relative;
        }

        /* 1. NEVOA DE FUNDO */
        .fog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.05) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
        }

        canvas { 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0; 
        }

        /* 2. CONFIGURAÇÃO DOS GIFS (MAIORES E SÓ EIXO X) */
        .floating-gif {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            opacity: 0.2; /* Translucidez */
            filter: blur(0.5px);
            /* Animação apenas no Eixo X */
            animation: moveX linear infinite;
        }

        @keyframes moveX {
            from { transform: translateX(-20vw); } /* Começa fora da tela à esquerda */
            to { transform: translateX(120vw); }   /* Vai até fora da tela à direita */
        }

        /* 3. CARD CENTRAL */
        main {
            position: relative;
            z-index: 10; 
            background-color: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .frase {
            font-size: 3rem;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 0 0 15px #00ffff;
        }

        .gif-principal img {
            max-width: 200px;
            filter: drop-shadow(0 0 15px #00ffff);
        }
    </style>
</head>
<body>

<div class="fog"></div>
<canvas id="starCanvas"></canvas>

<main>
    <div class="gif-principal">
        <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdG1pYTd5ZWJzaHdtenRtczZqcTNjc2ozazh5Z3RhMWFqc3RxbTh1dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9dHM/qUABlXKRRvfQobzIXp/giphy.gif" alt="Astronauta">
    </div>
    <h1 class="frase">Hello, World!</h1>
</main>

<script>
    // --- Estrelas de fundo ---
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    function setup() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 250; i++) {
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.2, 0, Math.PI*2);
            ctx.fill();
        }
    }
    window.addEventListener('resize', setup);
    setup();

    // --- Gerador de GIFs Maiores e Horizontais ---
    const gifUrl = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnBsdGpnemR4bXlnbTl3dG55YzhkOXZjZ2x5bGJiOGU1djY3Z2diZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/xT9IgsFcDKywF7orkI/giphy.gif";
    const totalGifs = 6; // Reduzi a quantidade porque agora eles são maiores

    for (let i = 0; i < totalGifs; i++) {
        const img = document.createElement('img');
        img.src = gifUrl;
        img.className = 'floating-gif';
        
        // Espalhamento vertical aleatório
        img.style.top = Math.random() * 80 + "vh";
        
        // Tamanho maior (entre 200px e 400px)
        const size = Math.random() * 200 + 200;
        img.style.width = size + "px";
        
        // Velocidades variadas para dar profundidade
        const duration = Math.random() * 20 + 15;
        const delay = Math.random() * -30; // Para começarem em pontos diferentes do percurso
        
        img.style.animationDuration = duration + "s";
        img.style.animationDelay = delay + "s";

        document.body.appendChild(img);
    }
</script>

</body>
</html>
