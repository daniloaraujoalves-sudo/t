<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HELLO World - Atmosfera Neon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(to bottom, #000814, #01476f, #380155);
            display: flex;
            align-items: center;      
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
            color: white;
            position: relative;
        }

        canvas { 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0; 
        }

        /* 1. CONFIGURAÇÃO DAS NUVENS (NATURAL E HORIZONTAL) */
        .floating-gif {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            opacity: 0; /* Começa invisível para o fade-in */
            filter: blur(2px);
            /* Animação: Deslocamento X + Opacidade suave */
            animation: moveNatural linear infinite;
        }

        @keyframes moveNatural {
            0% { 
                transform: translateX(-40vw); 
                opacity: 0; 
            }
            10% { 
                opacity: 0.15; /* Surge suavemente ao entrar */
            }
            90% { 
                opacity: 0.15; 
            }
            100% { 
                transform: translateX(110vw); 
                opacity: 0; /* Some suavemente ao sair */
            }
        }

        /* 2. CARD CENTRAL (ESTILO VIDRO) */
        main {
            position: relative;
            z-index: 10; 
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px;
            max-width: 500px;
            width: 90%;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .frase {
            font-size: 3.5rem;
            margin-top: 20px;
            font-weight: bold;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .gif-principal img {
            max-width: 180px;
            filter: drop-shadow(0 0 20px #00ffff);
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<main>
    <div class="gif-principal">
        <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdG1pYTd5ZWJzaHdtenRtczZqcTNjc2ozazh5Z3RhMWFqc3RxbTh1dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9dHM/qUABlXKRRvfQobzIXp/giphy.gif" alt="Astronauta">
    </div>
    <h1 class="frase">Hello, World!</h1>
</main>

<script>
    // --- Estrelas ---
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    function setup() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
    }
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 200; i++) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath();
            ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*1.1, 0, Math.PI*2);
            ctx.fill();
        }
    }
    window.addEventListener('resize', setup);
    setup();

    // --- Gerador de Nuvens Naturais ---
    const gifUrl = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnBsdGpnemR4bXlnbTl3dG55YzhkOXZjZ2x5bGJiOGU1djY3Z2diZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/xT9IgsFcDKywF7orkI/giphy.gif";
    const totalGifs = 7; 

    for (let i = 0; i < totalGifs; i++) {
        const img = document.createElement('img');
        img.src = gifUrl;
        img.className = 'floating-gif';
        
        // Posição vertical variada (mais espalhado)
        img.style.top = (Math.random() * 100) - 10 + "vh";
        
        // Tamanhos bem grandes e variados para naturalidade
        const size = Math.random() * 300 + 250; 
        img.style.width = size + "px";
        
        // Velocidades lentas e diferentes (entre 25s e 45s)
        const duration = Math.random() * 20 + 25;
        // Delay negativo para que já existam nuvens na tela ao carregar
        const delay = Math.random() * -50; 
        
        img.style.animationDuration = duration + "s";
        img.style.animationDelay = delay + "s";

        document.body.appendChild(img);
    }
</script>

</body>
</html>
