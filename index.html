<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrelas Corrigidas</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background-color: #ffffff; /* Fundo branco */
        }
        canvas { 
            display: block; 
            image-rendering: pixelated; /* Mantém os pontos nítidos */
        }
    </style>
</head>
<body>

<canvas id="starCanvas"></canvas>

<script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');

    // Função para ajustar o tamanho e redesenhar
    function setupCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        drawStars();
    }

    function drawStars() {
        // Limpa o canvas antes de desenhar
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Define a cor dos pontos (estrelas pretas)
        ctx.fillStyle = "black"; 

        // Calcula a quantidade de estrelas baseada na área da tela
        // Aproximadamente 1 estrela para cada 2500 pixels quadrados
        const starCount = Math.floor((canvas.width * canvas.height) / 2500);

        for (let i = 0; i < starCount; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            
            // Variação de tamanho: a maioria tem 1px, algumas têm 2px
            const size = Math.random() > 0.9 ? 2 : 1; 

            // Define opacidade aleatória para dar profundidade
            ctx.globalAlpha = Math.random() * 0.8 + 0.2;
            
            // Desenha o ponto (quadrado é mais rápido que círculo)
            ctx.fillRect(x, y, size, size);
        }
        
        // Reseta a opacidade global para não afetar outros desenhos
        ctx.globalAlpha = 1.0;
    }

    // Escuta o redimensionamento da janela
    window.addEventListener('resize', setupCanvas);

    // Inicializa
    setupCanvas();
</script>

</body>
</html>
