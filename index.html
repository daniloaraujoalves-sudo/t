<head>

    <title>Meu Primeiro Site</title>
    
    <style>
        /* O CSS entra aqui dentro */
        body { background: linear-gradient(to bottom, #002c46, #01476f, #380155); text-align: center; }
        
        .gif-neon {
            filter: drop-shadow(0 0 10px #00f7ff) drop-shadow(0 0 20px #ff0044);
            animation: pulsar 10s infinite alternate;
        }

        @keyframes pulsar {
            from { filter: drop-shadow(0 0 5px #00f7ff); }
            to { filter: drop-shadow(0 0 5px #00f7ff) drop-shadow(0 0 40px #00f7ff); }
        }
    </style>
</head>
